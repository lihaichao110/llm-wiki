<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm-wiki · 概念关系图</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172433;
      background: #f4f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      min-height: 100vh;
    }

    main {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    #graph {
      position: absolute;
      inset: 0;
    }

    /* 让搜索框和图例占据画布两端，搜索结果展开时也不会互相遮挡。 */
    .graph-overlays {
      position: absolute;
      z-index: 2;
      top: 20px;
      bottom: 20px;
      left: 20px;
      width: min(360px, calc(100% - 40px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      pointer-events: none;
    }

    .toolbar,
    .legend {
      padding: 18px;
      border: 1px solid #e1e8ee;
      border-radius: 16px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 12px 32px rgba(27, 47, 68, .1);
      pointer-events: auto;
    }

    .toolbar h1 {
      margin: 0 0 4px;
      font-size: 19px;
    }

    .toolbar p {
      margin: 0 0 14px;
      color: #627588;
      font-size: 13px;
    }

    .search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd8e3;
      border-radius: 9px;
      background: white;
      color: inherit;
      font: inherit;
      outline-color: #3183c5;
    }

    #search-results {
      display: grid;
      gap: 3px;
      max-height: min(220px, 25vh);
      overflow: auto;
      margin-top: 8px;
    }

    .legend {
      padding: 16px 18px;
    }

    .legend h2 {
      margin: 0 0 13px;
      color: #263e52;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .legend ul {
      display: grid;
      gap: 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .legend li {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: start;
      gap: 12px;
    }

    /* 样例沿用图中两类连线的颜色与线型，适当加粗以便在卡片上辨认。 */
    .legend-line {
      display: block;
      width: 38px;
      margin-top: 9px;
      border-top: 2px solid #a8bbca;
    }

    .legend-line--directory {
      border-top-color: #b7c8d4;
      border-top-style: dashed;
    }

    .legend strong {
      color: #263e52;
      font-size: 13px;
      font-weight: 650;
    }

    .legend p {
      margin: 4px 0 0;
      color: #627588;
      font-size: 12px;
      line-height: 1.5;
    }

    #search-results button,
    .related button {
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #196da9;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    #search-results button {
      padding: 7px 9px;
    }

    #search-results button:hover,
    .related button:hover {
      background: #eaf3fb;
    }

    aside {
      z-index: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 26px 24px;
      border-left: 1px solid #e1e8ee;
      background: white;
      box-shadow: -8px 0 24px rgba(27, 47, 68, .03);
    }

    aside h2 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    aside h3 {
      margin: 24px 0 9px;
      font-size: 14px;
    }

    aside p {
      margin: 0;
      color: #4f6375;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .muted {
      color: #718394;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .tags span {
      padding: 5px 9px;
      border-radius: 99px;
      background: #eaf3fb;
      color: #276d9f;
      font-size: 12px;
    }

    .related {
      display: grid;
      gap: 4px;
    }

    .related button {
      padding: 6px 8px;
    }

    .notice {
      margin-top: 22px;
      padding: 12px;
      border-radius: 9px;
      background: #fff7e7;
      color: #74551f;
      font-size: 12px;
      line-height: 1.5;
    }

    .notice ul {
      margin: 7px 0 0;
      padding-left: 18px;
    }

    .notice li+li {
      margin-top: 5px;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      main {
        min-height: max(62vh, 560px);
      }

      #search-results {
        max-height: 100px;
      }

      aside {
        height: auto;
        overflow: visible;
        border-left: 0;
        border-top: 1px solid #e1e8ee;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main>
      <div id="graph" aria-label="概念关系图"></div>
      <div class="graph-overlays">
        <div class="toolbar">
          <h1>概念关系图</h1>
          <p id="graph-count">正在读取 Wiki…</p>
          <input id="search" class="search" type="search" placeholder="搜索概念或别名" aria-label="搜索概念或别名" autocomplete="off">
          <div id="search-results" aria-live="polite"></div>
        </div>
        <section class="legend" aria-labelledby="legend-title">
          <h2 id="legend-title">连线说明</h2>
          <ul>
            <li>
              <span class="legend-line" aria-hidden="true"></span>
              <div>
                <strong>实线 · 概念关联</strong>
                <p>概念页的「相关概念」章节引用了另一概念。</p>
              </div>
            </li>
            <li>
              <span class="legend-line legend-line--directory" aria-hidden="true"></span>
              <div>
                <strong>虚线 · 目录收录</strong>
                <p>中心目录通过 wiki/index.md 收录了该概念。</p>
              </div>
            </li>
          </ul>
        </section>
      </div>
    </main>
    <aside id="details" aria-live="polite">
      <h2>选择一个节点</h2>
      <p>点击根节点查看目录，或点击概念查看摘要、标签和相关概念。</p>
    </aside>
  </div>
  <script src="/client.js" defer></script>
</body>

</html>
