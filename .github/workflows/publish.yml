name: 发布 npm 包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          # 手动发布时要从完整历史中确定 main 上最新的版本 tag。
          fetch-depth: 0

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: 确定发布 tag 和版本
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "手动发布只允许从 main 分支运行。" >&2
              exit 1
            fi

            # 选择 main 历史中版本号最高的 v* tag，避免依赖 tag 的创建时间。
            tag="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "没有找到可用于发布的 v* tag。" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${tag#v}"
          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "package.json 版本 ${package_version} 与发布 tag ${tag} 不一致。" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "准备发布 ${tag}（${package_version}），代码来源：${GITHUB_REF_NAME}。"

      - name: 检查 npm 版本
        id: npm
        shell: bash
        run: |
          package="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "${package}" version >/dev/null 2>&1; then
            echo "${package} 已发布，跳过 npm 发布。"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${package} 尚未发布。"
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 安装依赖
        if: steps.npm.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: 构建发布产物
        if: steps.npm.outputs.published == 'false'
        run: pnpm run build

      - name: 提交 npm 待审核版本
        if: steps.npm.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG_NAME} 已存在，跳过创建。"
          else
            gh release create "${TAG_NAME}" --verify-tag --generate-notes --title "${TAG_NAME}"
          fi
